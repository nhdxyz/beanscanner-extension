<!DOCTYPE html>
<html>
<head>
    <title>BeanScanner Settings</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .container {
            padding: 20px;
        }
        label {
            display: block;
            margin: 10px 0 5px;
        }
        input[type="text"] {
            width: 100%;
            padding: 8px;
            margin: 5px 0 10px;
            box-sizing: border-box;
        }
        .button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>BeanScanner Settings</h2>
        <label for="apiUrl">Discord Webhook URL</label>
        <input type="text" id="apiUrl">
        <button id="saveSettings" class="button">Save</button>
        <button id="testWebhook" class="button">Test Webhook</button>

        <label for="botSelect">Select Bot to Buy With</label>
        <select id="botSelect">
            <option value="Photon">Photon</option>
            <option value="BonkBot">BonkBot</option>
        </select>
        <button id="saveBot" class="button">Save bot</button>
    </div>
    <script src="options.js"></script>
</body>
</html>
